<section class="hero" id="hero">
  <div class="hero__inner">
    <h1 class="hero__title">Your headline here</h1>
    <p class="hero__text">
      A short supporting line that explains the value or main benefit of your
      product or service.
    </p>
    <div class="hero__actions">
      <a class="hero__btn hero__btn--primary" href="#cta">Get started</a>
      <a class="hero__btn hero__btn--secondary" href="#features">Learn more</a>
    </div>
    {{picture "/images/test.png" "Hero image" class="hero-image"}}
    <video
      class="hero__video"
      src="/video/test-video.mp4"
      autoplay
      loop
      muted
      playsinline
    ></video>
  </div>
</section>
